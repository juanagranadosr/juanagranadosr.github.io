<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-label="Juana Granados" {% endif %}>
      {% unless page.url == '/' %}<span class="site-brand-name">Juana Granados</span>{% endunless %}
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span>
      <span class="visually-hidden">Menu</span>
    </button>
    <nav class="site-nav" id="site-nav">
      {% for item in site.nav %}
      <a href="{{ item.link | relative_url }}" {% if page.url == item.link %}aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
<script>
  document.getElementById('nav-toggle').addEventListener('click', function () {
    var open = document.body.classList.toggle('nav-open');
    this.setAttribute('aria-expanded', open);
  });
</script>
