title: "Juana Granados"
tagline: "Theoretical Physicist"
email: jgranadosr24@gmail.com
github_username: juanagranadosr
description: >-
  Personal site of Juana Granados, theoretical physicist working on
  quantum field theory, mathematical physics, and renormalization-group
  methods, with experimental experience in nanomagnetism.

url: "https://juanagranadosr.github.io"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:title/

nav:
  - name: "Projects"
    link: "/projects/"
  - name: "Research"
    link: "/research/"
  - name: "CV"
    link: "/cv/"
  - name: "Contact"
    link: "/contact/"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"
